name: Build and verify Jet bot image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jet-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'Athathoth-Doth-Decode/telegram-jet-top-movie-bot' && github.ref == 'refs/heads/main'
    runs-on: arc-runner-set
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Export runner proxy settings
        shell: bash
        run: |
          set -euo pipefail
          for upper in HTTP_PROXY HTTPS_PROXY NO_PROXY; do
            lower=${upper,,}
            value=${!lower:-${!upper:-}}
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Invalid multiline proxy setting: $upper" >&2
              exit 1
            fi
            printf '%s=%s\n' "$upper" "$value" >> "$GITHUB_ENV"
            printf '%s=%s\n' "$lower" "$value" >> "$GITHUB_ENV"
          done

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.trak.spb.ru
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            "env.HTTP_PROXY=${{ env.HTTP_PROXY }}"
            "env.HTTPS_PROXY=${{ env.HTTPS_PROXY }}"
            "env.NO_PROXY=${{ env.NO_PROXY }}"

      - name: Build local candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          no-cache-filters: runtime
          provenance: false
          tags: jet-bot:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/Athathoth-Doth-Decode/telegram-jet-top-movie-bot
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            HTTP_PROXY
            HTTPS_PROXY
            NO_PROXY
            http_proxy
            https_proxy
            no_proxy

      - name: Stage PostgreSQL test image through BuildKit proxy
        shell: bash
        run: |
          set -euo pipefail
          printf 'FROM docker.io/library/postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636\n' | \
            docker buildx build --load --provenance=false -t jet-test-postgres:18.4 -

      - name: Check startup, PostgreSQL migrations and restart
        shell: bash
        run: bash operations/test-runtime.sh jet-bot:candidate jet-test-postgres:18.4

      # Export the tested BuildKit result without refreshing the runtime again.
      # Feature branches publish a candidate only; main also updates latest.
      # Trivy scanning and a GitOps digest review are required before deployment.
      - name: Publish candidate to Zot
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=true
          provenance: false
          tags: |
            registry.trak.spb.ru/jet-movie-top-bot:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'registry.trak.spb.ru/jet-movie-top-bot:latest' || format('registry.trak.spb.ru/jet-movie-top-bot:candidate-{0}', github.sha) }}
          labels: |
            org.opencontainers.image.source=https://github.com/Athathoth-Doth-Decode/telegram-jet-top-movie-bot
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            HTTP_PROXY
            HTTPS_PROXY
            NO_PROXY
            http_proxy
            https_proxy
            no_proxy

      - name: Record candidate digest
        env:
          CANDIDATE_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Candidate: `registry.trak.spb.ru/jet-movie-top-bot@%s`\n' "$CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Unit tests, startup, PostgreSQL migrations and restart checks passed. Trivy scan is required before GitOps deployment.\n' >> "$GITHUB_STEP_SUMMARY"
