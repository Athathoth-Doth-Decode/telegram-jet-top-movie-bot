telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    name: ${TELEGRAM_BOT_NAME}
    proxy:
      enabled: ${USE_PROXY:false}
      host: ${PROXY_HOST:}
      port: ${PROXY_PORT:3128}
      type: ${PROXY_TYPE:HTTP}
    admin-user-id: ${TELEGRAM_ADMIN_USER_ID:0}

kinopoisk:
  url: ${KINOPOISK_URL:https://api.poiskkino.dev}
  token: ${KINOPOISK_TOKEN}

feign:
  client:
    config:
      kinopoisk-movie:
        connectTimeout: 3000
        readTimeout: 5000
        retryer: ru.poseidonnet.jet_movie_top_bot.kinopoisk.api.MovieApiRetryer

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

backup:
  path: /usr/local/var/db/db.json

logging:
  level:
    root: INFO
#    ru.poseidonnet: DEBUG
#    org.springframework.web: ERROR
#    org.telegram: DEBUG
#    okhttp3: DEBUG
#    org.apache.http: DEBUG
#    org.springframework.cloud.openfeign: TRACE
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"